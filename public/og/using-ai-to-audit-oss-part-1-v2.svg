<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Using AI to audit OSS, part 1: 14 CVEs</title>
  <desc id="desc">The BomboBombone post viewer showing the article title, author artwork, address gutter, and opening text.</desc>

  <rect width="1200" height="630" fill="#070b10"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#506a84" stroke-width="2"/>

  <!-- Window title bar -->
  <rect width="1200" height="52" fill="#111b26"/>
  <path d="M0 52h1200" stroke="#506a84"/>
  <image href="../favicon.png" x="18" y="15" width="22" height="22"/>
  <text x="50" y="35" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">BomboBombone.exe</text>
  <text x="1178" y="33" fill="#afc3d6" font-family="Consolas, 'Courier New', monospace" font-size="13" text-anchor="end">ARCHITECTURE : x86-64</text>

  <!-- Post navigation strip -->
  <rect y="52" width="1200" height="52" fill="#111b26"/>
  <path d="M0 104h1200" stroke="#506a84"/>
  <path d="M22 78h11m-11 0 4-4m-4 4 4 4" fill="none" stroke="#64c4ff" stroke-width="1.5"/>
  <text x="40" y="82" fill="#afc3d6" font-family="Consolas, 'Courier New', monospace" font-size="11">BACK</text>
  <text x="108" y="83" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">.DATA</text>
  <text x="174" y="82" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="11">AI / VULNERABILITY RESEARCH</text>
  <text x="1178" y="82" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="end">08 SEPT 2026 · 6 MIN</text>

  <!-- Article header -->
  <path d="M0 298h1200" stroke="#506a84"/>
  <text x="34" y="142" fill="#64c4ff" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700">AI / VULNERABILITY RESEARCH · 08 SEPT 2026</text>
  <text x="34" y="199" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Using AI to audit OSS,</text>
  <text x="34" y="249" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">part 1: 14 CVEs</text>
  <text x="35" y="279" fill="#afc3d6" font-family="Arial, Helvetica, sans-serif" font-size="17">How a weekend research effort turned into fourteen validated and fixed vulnerabilities</text>

  <rect x="1018" y="122" width="158" height="158" fill="#f8f8f5" stroke="#506a84" stroke-width="2"/>
  <image href="../favicon.png" x="1019" y="123" width="156" height="156" preserveAspectRatio="xMidYMid slice"/>

  <!-- Post viewer toolbar -->
  <rect y="299" width="1200" height="46" fill="#111b26"/>
  <path d="M0 345h1200" stroke="#506a84"/>
  <text x="16" y="328" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700">POST VIEW</text>
  <text x="100" y="328" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="10">TEXT / UTF-8</text>
  <rect x="944" y="307" width="90" height="30" fill="#1d5b91" stroke="#506a84"/>
  <text x="989" y="327" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle">RENDERED</text>
  <text x="1080" y="327" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="10" text-anchor="middle">SOURCE</text>
  <text x="1153" y="327" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="10" text-anchor="middle">HEX</text>

  <!-- Column labels -->
  <rect y="346" width="1200" height="30" fill="#111b26"/>
  <path d="M0 376h1200M148 346v254" stroke="#506a84"/>
  <text x="16" y="365" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="9">ADDRESS</text>
  <text x="170" y="365" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="9">MARKDOWN</text>

  <!-- Opening article rows -->
  <rect y="376" width="148" height="224" fill="#0d151e"/>
  <text x="16" y="412" fill="#9ebedd" font-family="Consolas, 'Courier New', monospace" font-size="10">0000000000421400</text>
  <text x="16" y="442" fill="#9ebedd" font-family="Consolas, 'Courier New', monospace" font-size="10">0000000000421449</text>
  <text x="16" y="472" fill="#9ebedd" font-family="Consolas, 'Courier New', monospace" font-size="10">0000000000421492</text>
  <text x="16" y="522" fill="#9ebedd" font-family="Consolas, 'Courier New', monospace" font-size="10">00000000004214DA</text>
  <text x="16" y="566" fill="#9ebedd" font-family="Consolas, 'Courier New', monospace" font-size="10">00000000004214EF</text>

  <text x="170" y="413" fill="#dce8f3" font-family="Arial, Helvetica, sans-serif" font-size="18">Weeks ago a close friend of mine suggested I take a look at XenForo as a next target.</text>
  <text x="170" y="443" fill="#dce8f3" font-family="Arial, Helvetica, sans-serif" font-size="18">I had previously been tinkering with some Windows antivirus products, namely Avast</text>
  <text x="170" y="473" fill="#dce8f3" font-family="Arial, Helvetica, sans-serif" font-size="18">and Malwarebytes, and have had some success with AI-assisted auditing.</text>
  <text x="170" y="523" fill="#dce8f3" font-family="Arial, Helvetica, sans-serif" font-size="18">Since the vendors were taking their time to respond, I decided to go look around</text>
  <text x="170" y="553" fill="#dce8f3" font-family="Arial, Helvetica, sans-serif" font-size="18">and find some new targets to improve my “AI methodology”.</text>

  <!-- Status bar -->
  <rect y="600" width="1200" height="30" fill="#111b26"/>
  <path d="M0 600h1200" stroke="#506a84"/>
  <text x="16" y="620" fill="#64c4ff" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700">AU:</text>
  <text x="40" y="620" fill="#afc3d6" font-family="Consolas, 'Courier New', monospace" font-size="10">IDLE</text>
  <text x="1178" y="620" fill="#91a9bf" font-family="Consolas, 'Courier New', monospace" font-size="10" text-anchor="end">VIEW: POST VIEW · CURSOR: 0000000000421400 · .DATA</text>
</svg>
